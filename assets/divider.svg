<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24">
  <defs>
    <linearGradient id="base" x1="0" x2="1">
      <stop offset="0" stop-color="#8d97a8" stop-opacity="0"/><stop offset="0.5" stop-color="#8d97a8" stop-opacity="0.7"/><stop offset="1" stop-color="#8d97a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="1000" height="2" fill="url(#base)"/>
  <rect y="10" width="140" height="4" fill="url(#spark)" opacity="0.9"><animate attributeName="x" values="-150;1010" dur="3.5s" repeatCount="indefinite"/></rect>
  <g transform="translate(500 12)">
    <rect x="-6" y="-6" width="12" height="12" fill="#060a14" stroke="#e6e9ef" stroke-width="1.5" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" values="45;225;405" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle r="2.5" fill="#e6e9ef"><animate attributeName="r" values="2;3.5;2" dur="2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
